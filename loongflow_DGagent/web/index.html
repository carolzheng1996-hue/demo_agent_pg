<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>agent for time series analysis</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-head">
          <div>
            <p class="eyebrow">agent</p>
            <h1>agent for time series analysis</h1>
          </div>
          <button id="refreshTasksButton" class="ghost-button" type="button">刷新</button>
        </div>
        <div class="sidebar-search">
          <input id="taskSearchInput" type="search" placeholder="搜索任务 ID、数据集或目标列" />
        </div>
        <div id="taskList" class="task-list empty-state">暂无任务记录。</div>
      </aside>

      <main class="main-shell">
        <section class="top-grid">
          <section class="panel panel-form">
            <div class="panel-head">
              <h2>任务参数</h2>
              <button id="loadDefaultsButton" class="ghost-button" type="button">恢复默认值</button>
            </div>

            <form id="jobForm" class="job-form">
              <label>
                <span>任务描述</span>
                <textarea id="query" name="query" rows="3" required></textarea>
              </label>

              <label>
                <span>数据集路径</span>
                <input id="dataset_path" name="dataset_path" type="text" required />
              </label>

              <label>
                <span>数据集名称</span>
                <input id="dataset_name" name="dataset_name" type="text" />
              </label>

              <label>
                <span>目标列</span>
                <input id="target_col" name="target_col" type="text" placeholder="单列如 LULL；多列如 LULL,OT" />
              </label>

              <label class="checkbox-row">
                <input id="use_custom_processing" name="use_custom_processing" type="checkbox" />
                <span>启用自定义数据处理流程</span>
              </label>

              <label>
                <span>自定义数据处理说明</span>
                <textarea id="custom_processing_steps" name="custom_processing_steps" rows="3" placeholder="描述你希望进行的数据筛选、列处理、窗口构造或标签生成方式"></textarea>
              </label>

              <div class="ratio-grid">
                <label>
                  <span>Train Ratio</span>
                  <input id="train_ratio" name="train_ratio" type="number" step="0.01" min="0" max="1" />
                </label>
                <label>
                  <span>Val Ratio</span>
                  <input id="val_ratio" name="val_ratio" type="number" step="0.01" min="0" max="1" />
                </label>
                <label>
                  <span>Test Ratio</span>
                  <input id="test_ratio" name="test_ratio" type="number" step="0.01" min="0" max="1" />
                </label>
                <label>
                  <span>最大迭代轮数</span>
                  <input id="max_iterations" name="max_iterations" type="number" step="1" min="1" max="10" />
                </label>
                <label>
                  <span>Input Length</span>
                  <input id="input_length" name="input_length" type="number" step="1" min="1" />
                </label>
                <label>
                  <span>Output Length</span>
                  <input id="output_length" name="output_length" type="number" step="1" min="1" />
                </label>
                <label>
                  <span>Time Increment</span>
                  <input id="time_increment" name="time_increment" type="number" step="1" min="1" />
                </label>
                <label>
                  <span>Normalization</span>
                  <select id="normalization_policy" name="normalization_policy">
                    <option value="auto">Auto</option>
                    <option value="force_on">Force On</option>
                    <option value="force_off">Force Off</option>
                  </select>
                </label>
              </div>

              <label class="checkbox-row">
                <input id="approve_generated_code" name="approve_generated_code" type="checkbox" />
                <span>直接批准并执行 data_formatter 生成代码</span>
              </label>

              <div class="form-actions">
                <button id="submitButton" class="primary-button" type="submit">提交任务</button>
                <p id="formHint" class="muted-text">
                  如果取消勾选批准选项，任务会在 `data_formatter` 阶段暂停，并展示待审批代码。
                </p>
              </div>
            </form>
          </section>

          <section class="panel panel-status">
            <div class="panel-head">
              <h2>当前任务</h2>
              <span id="jobStatusPill" class="status-pill idle">Idle</span>
            </div>

            <div id="jobStatusCard" class="status-card empty-state">
              提交任务后，这里会显示运行状态、计划、审批提示和错误信息。
            </div>
          </section>
        </section>

        <section class="panel panel-detail">
          <div class="panel-head">
            <h2>任务详情</h2>
            <span id="taskDetailMeta" class="muted-text">未选择任务，选中后显示任务 ID、状态和轮次</span>
          </div>
          <div id="taskDetail" class="task-detail empty-state">尚未选择任务。</div>
        </section>
      </main>
    </div>

    <template id="stepTemplate">
      <article class="step-card">
        <div class="step-card-head">
          <h4 class="step-title"></h4>
          <span class="step-file-count"></span>
        </div>
        <div class="step-body"></div>
      </article>
    </template>

    <script src="/app.js" defer></script>
  </body>
</html>
